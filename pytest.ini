[pytest]

# 'r' shows extra test summary info
# 'a' shows all except passed tests
addopts = -ra

# "external" tests make real network calls to third-party services (ENA's
# dev sandbox, production Zenodo) and are excluded from the default
# run_playwright_tests.sh run — see docs/testing/PLAYWRIGHT.md.
markers =
    external: makes real calls to external services (ENA/Zenodo); opt-in only

# Django settings are configured in test/unit/conftest.py, not here: the
# DJANGO_SETTINGS_MODULE key is only read by the pytest-django plugin, which is
# a dev-only dependency and is not present in the deployed image.

python_files =
    tests.py
    test_*.py
    *_tests.py

# A bare `pytest` runs the unit suite. This excludes the empty src/apps/*/tests.py
# stubs, and the browser tests, which need a running COPO and are run explicitly:
#   pytest test/playwright
testpaths =
    test/unit