[pytest]

# 'r' shows extra test summary info
# 'a' shows all except passed tests
addopts = -ra

# roc-validator's wheel wrongly installs its own pyproject.toml into the
# site-packages root. Biopython sees that file next to its package and assumes
# it is being imported from a source checkout, so it warns on every import.
# The warning is cosmetic and there is no newer roc-validator that drops the file.
#
# Manifests saved in Excel store dropdown menus that list values from another
# sheet (e.g. sample_metadata!$A$2:$A$1000) as an x14 data validation extension.
# openpyxl does not support it so, it drops those dropdown menus and warns each
# time such a workbook is loaded. The tests only read and write cell values,
# not dropdown menus, and Excel adds the extension back whenever a test file is
# saved again so, the warning is ignored rather than removed from the files.
filterwarnings =
    ignore:You may be importing Biopython from inside the source tree
    ignore:Data Validation extension is not supported:UserWarning:openpyxl

# "external" tests make real network calls to services outside the local
# project stack (like to ENA's dev sandbox, Zenodo's production instance, 
# or to Sapio LIMS' test instance)
# and are excluded from the default `run_playwright_tests.sh` run script
# See the `docs/testing/PLAYWRIGHT.md` for reference.
markers =
    external: makes real calls to external services (ENA/Zenodo/Sapio); opt-in only

# Django settings are configured in test/unit/conftest.py, not here: the
# DJANGO_SETTINGS_MODULE key is only read by the pytest-django plugin, which is
# a dev-only dependency and is not present in the deployed image.

python_files =
    tests.py
    test_*.py
    *_tests.py

# A bare `pytest` runs the unit suite. This excludes the empty src/apps/*/tests.py
# stubs, and the browser tests, which need a running COPO and are run explicitly:
#   pytest test/playwright
testpaths =
    test/unit