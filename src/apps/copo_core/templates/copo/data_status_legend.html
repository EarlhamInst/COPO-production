<div class="row legend-and-sort-row">
  <div class="col-lg-6 col-md-8">
    <div class="component-legend" data-tour-id="component_legend" data-legend="data_status">
      <div class="component-legend-header collapsed"
           data-toggle="collapse"
           data-target="#dataStatusCollapse"
           aria-expanded="false"
           aria-controls="dataStatusCollapse">
        <span class="component-legend-title">Data status</span>
        <i class="fa fa-chevron-down component-legend-chevron"></i>
      </div>
      <div id="dataStatusCollapse" class="collapse">
        <ul class="component-legend-group">
          <li class="component-legend-group-item"
              data-toggle="tooltip" data-placement="right" data-html="true"
              title="<strong>Yellow highlight</strong> means the data has not yet been submitted to ENA — submission is queued or in progress and no accessions have been assigned.<br><br>Refer to the <strong>STATUS</strong> column: rows in this state show <em>pending</em>, <em>processing</em>, or <em>rejected</em>.">
            <i class="fa fa-info-circle component-legend-info-icon"></i>
            <span class="component-legend-text">Pending submission</span>
            <span class="fa fa-circle component-legend-circle" style="color:#ffd700"></span>
          </li>
          <li class="component-legend-group-item"
              data-toggle="tooltip" data-placement="right" data-html="true"
              title="<strong>Red highlight</strong> means <em>either</em> (a) an error occurred during submission and the data requires attention before it can be successfully submitted, <em>or</em> (b) the data has been submitted to ENA but is currently held privately (not yet released to the public).<br><br>Refer to the <strong>STATUS</strong> column for the submission state and the <strong>ENA FILE PROCESSING STATUS</strong> column for file-level error details.">
            <i class="fa fa-info-circle component-legend-info-icon"></i>
            <span class="component-legend-text">Error during submission</span>
            <span class="fa fa-circle component-legend-circle" style="color:#f88080"></span>
          </li>
          <li class="component-legend-group-item"
              data-toggle="tooltip" data-placement="right" data-html="true"
              title="<strong>Green highlight</strong> means the data has been successfully submitted to ENA, is publicly available, and has no errors — no further action is needed.<br><br>The <strong>STATUS</strong> column will show an assigned accession and the <strong>ENA FILE PROCESSING STATUS</strong> column will show <em>File archived</em>.">
            <i class="fa fa-info-circle component-legend-info-icon"></i>
            <span class="component-legend-text">Successful submission</span>
            <span class="fa fa-circle component-legend-circle" style="color:#5cb85c"></span>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
