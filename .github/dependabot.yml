# Dependabot version updates.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Schedule is MONTHLY with grouping, so each month produces roughly:
#   - one PR with every safe (minor + patch) Python update,
#   - one PR per Python MAJOR update, so each can be judged and tested alone,
#   - one PR for GitHub Actions, and an occasional Docker base-image PR.
#
# Security updates are NOT affected by this schedule: they are raised as soon
# as an advisory is published, as long as "Dependabot security updates" is
# enabled in the repository settings.

version: 2

updates:

  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"

    # Skip releases younger than a week, so a package that ships several
    # quick follow-up patches does not keep replacing the PR.
    cooldown:
      default-days: 7

    open-pull-requests-limit: 5

    labels:
      - "dependencies"
      - "python"

    groups:
      # Everything that should be safe, in a single PR. Majors are left out
      # on purpose and arrive as individual PRs (e.g. Django 6, pandas 3).
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

    ignore:
      # astroid must stay within pylint's supported range: pylint 4.0.7 (the
      # latest release as of writing) caps astroid at <=4.1.dev0, but astroid
      # itself has moved past that (4.3.0+). Dependabot keeps proposing astroid
      # bumps that can't actually be installed, breaking CI on every PR that
      # includes them. Hold at patch-level until pylint raises its astroid
      # ceiling.
      - dependency-name: "astroid"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Dockerfile base image updates
  - package-ecosystem: "docker"
    directory: "/deployment/web/"
    schedule:
      interval: "monthly"

    labels:
      - "docker"

    ignore:
      # The local dev images are deliberately pinned to the Ubuntu 24.04 LTS
      # (Python 3.12, matching production). Newer Ubuntu releases ship newer
      # Python (e.g. 26.04 -> 3.14) which breaks pinned C-extension deps such
      # as gevent. Moving off 24.04 is a deliberate migration, not an
      # automated bump, so ignore all ubuntu updates. See PR #115.
      - dependency-name: "ubuntu"
      # Python 3.14 is pre-release; hold at 3.12.x until 3.14 is stable.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

    labels:
      - "github-actions"

    groups:
      github-actions:
        patterns:
          - "*"
